name: distributed-chat-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${CHAT_MYSQL_SCHEMA:-wgt}
      MYSQL_USER: ${CHAT_MYSQL_USER:-chat}
      MYSQL_PASSWORD: ${CHAT_MYSQL_PASSWORD:-chat_dev_password}
      MYSQL_ROOT_PASSWORD: ${CHAT_MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${CHAT_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${CHAT_REDIS_PASSWORD:-chat_dev_password}
    ports:
      - "${CHAT_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CHAT_REDIS_PASSWORD:-chat_dev_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
