# Install on the TLS edge. Replace resource1/resource2 with private hostnames.
upstream resource_backend {
    least_conn;
    server resource1:8085 max_fails=2 fail_timeout=10s;
    server resource2:8085 max_fails=2 fail_timeout=10s;
}
server {
    listen 443 ssl;
    server_name resources.example.com;
    ssl_certificate /certs/resource-edge.crt;
    ssl_certificate_key /certs/resource-edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    client_body_timeout 30s;
    location /api/resources/v1/ {
        proxy_pass http://resource_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
        # Mutations are retried by the client using the original idempotency key/offset.
        proxy_next_upstream error timeout;
    }
}
