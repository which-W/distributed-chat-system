# Install in /etc/nginx/sites-available/deepecho; enable via sites-enabled.
server {
    listen 80;
    server_name api.deepecho.top chat.deepecho.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / { return 301 https://api.deepecho.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.deepecho.top;
    ssl_certificate /etc/letsencrypt/live/api.deepecho.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.deepecho.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location ^~ /api/resources/v1/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection close;
        client_max_body_size 5m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
