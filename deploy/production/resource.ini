# Single host only: one Resource Server owns this local persistent volume.
[Resource]
Host = 0.0.0.0
HttpPort = 8085
RpcPort = 50065
RequireNfs = false
[FileStorage]
Root = /data/files
MasterKey = replaced-by-environment
[Mysql]
Host = mysql
Port = 3306
User = chat
Passwd = replaced-by-environment
Schema = wgt
[Redis]
Host = redis
Port = 6379
User = default
Passwd = replaced-by-environment
[InternalRpc]
PeerToken = replaced-by-environment
[PeerServer]
Servers = chatserver1
[chatserver1]
Host = chatserver1
Port = 50055
TLSName = chatserver1
[GrpcTLS]
Mode = mtls
CACert = /certs/ca.crt
Cert = /certs/resource.crt
Key = /certs/resource.key
