# Include from TOP LEVEL of /etc/nginx/nginx.conf, outside http {}.
# If stream {} already exists, merge only its server block into the existing block.
stream {
    server {
        listen 8443 ssl;
        ssl_certificate /etc/letsencrypt/live/api.deepecho.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.deepecho.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_handshake_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
        proxy_pass 127.0.0.1:18989;
    }
}
