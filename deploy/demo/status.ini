[StatusServer]
Host = 0.0.0.0
Port = 5050
[GrpcTLS]
Mode = mtls
CACert = /certs/ca.crt
Cert = /certs/status.crt
Key = /certs/status.key
[InternalRpc]
GateToken = replaced-by-environment
[Redis]
Host = redis
Port = 6379
Passwd = replaced-by-environment
User = default
[Mysql]
Host = mysql
Port = 3306
Passwd = replaced-by-environment
User = chat
Schema = wgt
[chatservers]
Name = chatserver1,chatserver2
[chatserver1]
Name = chatserver1
PublicHost = chatserver1
PublicPort = 8989
Transport = insecure
[chatserver2]
Name = chatserver2
PublicHost = chatserver2
PublicPort = 8990
Transport = insecure
