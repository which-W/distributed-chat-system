name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-server:
    runs-on: ubuntu-24.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool libtirpc-dev
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Restore vcpkg binary cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'cmake/triplets/x64-linux-release.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-linux-${{ hashFiles('vcpkg.json', 'cmake/triplets/x64-linux-release.cmake') }}-
      - name: Configure
        run: cmake --fresh --preset linux-server-release
      - name: Save vcpkg binary cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'cmake/triplets/x64-linux-release.cmake') }}-${{ github.run_id }}
      - name: Build
        run: cmake --build --preset linux-server-release
      - name: Test
        run: ctest --test-dir build/linux-server-release --output-on-failure

  windows-client:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop 6.6.3 win64_msvc2022_64 -O C:\Qt
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/ci-windows-client -G Ninja -DCHAT_BUILD_SERVERS=OFF -DCHAT_BUILD_CLIENT=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:/Qt/6.6.3/msvc2022_64 -DCMAKE_CXX_COMPILER=cl
      - name: Build
        shell: pwsh
        run: cmake --build build/ci-windows-client
      - name: Test
        shell: pwsh
        run: ctest --test-dir build/ci-windows-client --output-on-failure

  node:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: VarifyServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VarifyServer/package-lock.json
      - run: npm ci
      - run: npm run deps:check
      - run: npm run check
      - run: npm test

  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check C++ formatting
        run: |
          files=$(git ls-files '*.cpp' '*.h' | grep -Ev '^(third_party|build)/')
          clang-format --dry-run --Werror $files

  docker-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run two-node acceptance suite
        env:
          E2E_BACKLOG: ${{ github.event_name == 'pull_request' && '257' || '1000' }}
        run: |
          sh scripts/demo.sh --keep
      - name: Run fault recovery suite
        if: github.event_name != 'pull_request'
        run: sh scripts/fault-test.sh
      - name: Smoke benchmark with resource sampling
        run: |
          docker compose --env-file build/demo/demo.env -f compose.demo.yaml --profile tools run --rm benchmark > build/demo/benchmark.log 2>&1 &
          benchmark_pid=$!
          while kill -0 "$benchmark_pid" 2>/dev/null; do
            docker stats --no-stream --format '{{json .}}' >> build/demo/reports/benchmark-resources.jsonl
            sleep 2
          done
          wait "$benchmark_pid"
      - name: Capture JSON logs
        if: always()
        run: docker compose --env-file build/demo/demo.env -f compose.demo.yaml logs --no-color > build/demo/services.jsonl || true
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-chat-e2e-${{ github.run_id }}
          path: |
            build/demo/reports
            build/demo/services.jsonl
            build/demo/benchmark.log
      - name: Clean up demo
        if: always()
        run: docker compose --env-file build/demo/demo.env -f compose.demo.yaml down --volumes --remove-orphans || true
